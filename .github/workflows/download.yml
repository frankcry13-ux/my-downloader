name: Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Direct URL"
        required: true

jobs:
  download:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full aria2

      - name: Prepare folders
        run: |
          mkdir -p downloads
          mkdir -p dl

      - name: Download file
        shell: bash
        run: |
          URL="${{ github.event.inputs.url }}"

          FILENAME=$(basename "$URL" | cut -d'?' -f1)

          if [ -z "$FILENAME" ]; then
            FILENAME="downloaded_file.bin"
          fi

          echo "Downloading $FILENAME"

          aria2c \
            --dir=downloads \
            --out="$FILENAME" \
            --split=16 \
            --min-split-size=1M \
            --max-tries=10 \
            --retry-wait=5 \
            --continue=true \
            --timeout=60 \
            --lowest-speed-limit=1K \
            --auto-file-renaming=false \
            --allow-overwrite=true \
            "$URL"

          echo "=== FILE INFO ==="

          ls -lh downloads/

          FILEPATH="downloads/$FILENAME"

          FILETYPE=$(file "$FILEPATH")

          echo "$FILETYPE"

          if echo "$FILETYPE" | grep -qiE "HTML|text"; then
            echo "ERROR: Downloaded HTML page instead of file"
            exit 1
          fi

          FILESIZE=$(stat -c%s "$FILEPATH")

          echo "SIZE=$FILESIZE"

          if [ "$FILESIZE" -lt 50000000 ]; then
            echo "ERROR: File too small"
            exit 1
          fi

      - name: Split file
        shell: bash
        run: |
          FILE=$(find downloads -type f | head -n 1)

          BASENAME=$(basename "$FILE")

          7z a -tzip -v95m "dl/${BASENAME}.zip" "$FILE"

      - name: Create links page
        shell: bash
        run: |
          echo "# Download Links" > LINKS.md
          echo "" >> LINKS.md

          for FILE in dl/*; do
            NAME=$(basename "$FILE")

            echo "- [$NAME](https://github.com/${{ github.repository }}/raw/main/dl/$NAME)" >> LINKS.md
          done

      - name: Push files
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add dl/*
          git add LINKS.md

          git commit -m "Add files" || echo "nothing to commit"

          git push
